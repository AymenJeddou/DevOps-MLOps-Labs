name: Python CI Pipeline

# Run on every push and pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Note: We point to the requirements file inside the ml-app folder
        pip install -r session2/ml-app/requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # We run flake8 from the root, so we point to the folders
        flake8 session2/ml-app/src/ session2/ml-app/tests/

    - name: Test with pytest
      run: |
        # We must run pytest from the folder containing the code
        cd session2/ml-app
        python -m pytest

    - name: Build Docker image
      run: |
        # We build from the root, but point to the Dockerfile's location
        docker build . --file session2/ml-app/Dockerfile --tag my-app:${{ github.sha }}